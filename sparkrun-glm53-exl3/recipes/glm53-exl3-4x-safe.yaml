# Safe first boot for the already-provisioned davidsyoung GLM-5.3 EXL3 cache.
#
# The model is intentionally a local absolute path: SparkRun verifies and
# identity-mounts it on every node, so it neither downloads nor copies weights.
# Point at the HF cache *root*, not snapshots/<revision>; the snapshot's blob
# symlinks then remain valid inside the container.
recipe_version: "2"
name: glm53-exl3-4x-safe
description: GLM-5.3 EXL3 on four Sparks, with a safe eager-memory envelope.
model: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw
runtime: vllm-distributed
container: spark-vllm-glm52-exl3:sparkring-switch-v1
min_nodes: 4
max_nodes: 4

metadata:
  model_dtype: exl3-3.42bpw
  description: Existing SparkRing EXL3 image; no image build or weight sync.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.80
  max_model_len: 32768
  max_num_seqs: 1
  max_num_batched_tokens: 1024
  served_model_name: glm-5.3-exl3-tr3-3.42bpw

# These retain the image's required GB10/EXL3 wiring. CUDA graph capture,
# MTP, the 1M context target, and the fixed 16.5 GB KV cache are deliberately
# absent from the first launch; add them only after recording a stable baseline.
env:
  LD_PRELOAD: /usr/local/cuda/compat/libcuda.so.1:/opt/sparkring/nccl/libnccl.so.2
  VLLM_NCCL_SO_PATH: /opt/sparkring/nccl/libnccl.so.2
  VLLM_WORKER_MULTIPROC_METHOD: forkserver
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NET: IB
  NCCL_CUMEM_ENABLE: "0"
  NCCL_CROSS_NIC: "1"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_GID_INDEX: "3"
  OMP_NUM_THREADS: "8"
  OPENBLAS_NUM_THREADS: "8"
  MKL_NUM_THREADS: "8"
  NUMEXPR_NUM_THREADS: "8"
  TOKENIZERS_PARALLELISM: "false"
  MALLOC_ARENA_MAX: "2"
  VLLM_USE_B12X_DCP_A2A: "1"
  VLLM_EXL3_PREFILL_CAPACITY: "1024"
  VLLM_USE_B12X_PCIE_DMA: "0"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_PCIE_DMA_FP8: "0"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  # This may be inherited from a cluster-wide SparkRun environment. GLM-5.3
  # has neither sliding-window nor Mamba KV groups, so vLLM rejects it.
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: ""

executor: docker
executor_config:
  # Deliberately no memory_limit. On GB10, a Docker cgroup ceiling is not a
  # reliable accounting boundary for the shared CPU/GPU UMA pool; leave
  # lifecycle and host protection to SparkRun and the configured host policy.
  # Remove the executor once SparkRun stops it. A failed `docker exec` can
  # otherwise leave its sleep-infinity executor holding model page cache and
  # /dev/shm allocations in the container cgroup.
  auto_remove: true
  entrypoint: ""
  gpu_access_mode: gpus
  ipc: host
  network: host
  shm_size: 16gb
  ulimit:
    - memlock=-1:-1
    - nofile=1048576:1048576
  devices:
    - /dev/infiniband:/dev/infiniband

command: |
  set -euo pipefail
  model_root="{model}"
  revision="$(cat "$model_root/refs/main")"
  model_path="$model_root/snapshots/$revision"
  test -r "$model_path/config.json"
  exec vllm serve "$model_path" \
    --served-model-name {served_model_name} \
    --host {host} --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend mp \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size 64 \
    --quantization exl3 \
    --load-format instanttensor \
    --attention-backend B12X_MLA_SPARSE \
    --moe-backend b12x \
    --kv-cache-dtype fp8 \
    --decode-context-parallel-size 4 \
    --dcp-comm-backend ag_rs \
    --dcp-kv-cache-interleave-size 1 \
    --disable-custom-all-reduce \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --enforce-eager
