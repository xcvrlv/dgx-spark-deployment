# Safe first boot for the already-provisioned davidsyoung GLM-5.3 EXL3 cache.
#
# The model is intentionally a local absolute path: SparkRun verifies and
# identity-mounts it on every node, so it neither downloads nor copies weights.
# Point at the HF cache *root*, not snapshots/<revision>; the snapshot's blob
# symlinks then remain valid inside the container.
recipe_version: "2"
name: glm53-exl3-4x-safe
description: GLM-5.3 EXL3 experimental MTP3 on four Sparks, with decode-only graphs.
model: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw
runtime: vllm-distributed
runtime_config:
  dashboard: false
container: spark-vllm-glm52-exl3:sparkring-switch-prefill-v2
min_nodes: 4
max_nodes: 4

metadata:
  model_dtype: exl3-3.42bpw
  description: Existing SparkRing EXL3 image; no image build or weight sync.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # A host-side, unconditional cache flusher is required on every node before
  # launch and for the entire model-load window. The measured clean-start value
  # was 112.90/121.63 GiB; 0.91 requests 110.68 GiB and leaves ~2.22 GiB of
  # admission margin. Use scripts/run-with-cache-flusher.sh so this fails closed.
  gpu_memory_utilization: 0.91
  max_model_len: 1048576
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  served_model_name: glm-5.3-exl3-tr3-3.42bpw

# These retain the image's required GB10/EXL3 wiring. The model's 1M context is
# advertised while vLLM sizes the KV pool inside the 0.91 memory envelope.
# MTP3 CUDA graphs are restricted to the uniform speculative-decode shapes
# below.
env:

  GLM53_INDEXER_WORKSPACE: rightsize

  LD_PRELOAD: /usr/local/cuda/compat/libcuda.so.1:/opt/sparkring/nccl/libnccl.so.2
  # Crash-capture run: keep evidence in the identity-mounted model root so it
  # survives SparkRun container cleanup on every node. CUDA memory segments are
  # deliberately omitted from the dump; otherwise one failure could emit an
  # artifact comparable in size to the loaded model.
  GLM53_DIAGNOSTICS_DIR: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw/.runtime-diagnostics
  PYTHONFAULTHANDLER: "1"
  CUDA_ENABLE_COREDUMP_ON_EXCEPTION: "1"
  CUDA_ENABLE_CPU_COREDUMP_ON_EXCEPTION: "0"
  CUDA_COREDUMP_GENERATION_FLAGS: skip_nonrelocated_elf_images,skip_global_memory,skip_shared_memory,skip_local_memory,skip_abort
  CUDA_COREDUMP_FILE: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw/.runtime-diagnostics/core.cuda.%t.%h.%p.nvcudmp
  VLLM_NCCL_SO_PATH: /opt/sparkring/nccl/libnccl.so.2
  VLLM_USE_V2_MODEL_RUNNER: "1"
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: 12.1a
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  NCCL_NET: IB
  NCCL_NVLS_ENABLE: "0"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_CROSS_NIC: "1"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_GID_INDEX: "3"
  OMP_NUM_THREADS: "8"
  MALLOC_ARENA_MAX: "2"
  VLLM_USE_B12X_DCP_A2A: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  # The checkpoint stores routed experts as mixed K3/K4 EXL3, but its shared
  # experts remain BF16. Restore SparkRing's online Trellis-K6 conversion for
  # those eligible BF16 weights; --quantization exl3 alone does not enable it.
  ONLINE_QUANT: exl3-b6
  VLLM_EXL3_EXT_PATH: /opt/exllamav3
  VLLM_EXL3_ENCODER_SOURCE: /opt/exllamav3-python/exllamav3
  VLLM_EXL3_ONLINE_CACHE_MODE: readwrite
  VLLM_EXL3_ONLINE_CACHE_DIR: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw/.exl3-online-k6
  VLLM_EXL3_PREFILL_CAPACITY: "4096"
  # Keep all MTP4 target graph rows (up to 5 * 8 = 40) inside the small-M
  # Trellis path. Start bulk prefill at block-M 32: this is the conservative
  # specialization before separately qualifying the patched 16/8 variants.
  VLLM_EXL3_TRELLIS_MIN_M: "1"
  VLLM_EXL3_TRELLIS_MAX_M: "64"
  VLLM_EXL3_TRELLIS_BLOCK_M: "8"
  VLLM_EXL3_PREFILL_TRELLIS: "1"
  VLLM_EXL3_PREFILL_BLOCK_M: "32"
  VLLM_EXL3_PREFILL_CHUNK: "128"
  # Keep the explicitly tested accuracy-oriented B12X activation path. A8 is
  # disabled so the two force modes cannot become ambiguous across images.
  B12X_W4A16_TC_DECODE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"
  VLLM_DCP_QUERY_SPLIT: "1"
  VLLM_DCP_QUERY_SPLIT_MIN_CONTEXT_TOKENS: "8192"
  VLLM_B12X_MLA_CKV_GATHER: "1"
  VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "131072"
  VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "0"
  VLLM_DCP_GLOBAL_TOPK: "1"
  VLLM_DCP_SHARD_DRAFT: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_MTP_INSTRUMENT: "1"
  VLLM_MTP_INSTRUMENT_WINDOW: "32"
  VLLM_USE_B12X_PCIE_DMA: "0"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_PCIE_DMA_FP8: "0"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"

executor: docker
executor_config:
  # Deliberately no memory_limit. On GB10, a Docker cgroup ceiling is not a
  # reliable accounting boundary for the shared CPU/GPU UMA pool; leave
  # lifecycle and host protection to SparkRun and the configured host policy.
  # Remove the executor once SparkRun stops it. A failed `docker exec` can
  # otherwise leave its sleep-infinity executor holding model page cache and
  # /dev/shm allocations in the container cgroup.
  auto_remove: false
  entrypoint: ""
  gpu_access_mode: gpus
  ipc: host
  network: host
  # Capacity only; Docker does not preallocate 32 GiB of shared memory.
  shm_size: 32gb
  ulimit:
    - memlock=-1:-1
    - nofile=1048576:1048576
  devices:
    - /dev/infiniband:/dev/infiniband

command: |
  set -euo pipefail
  # This may be inherited from a cluster-wide SparkRun environment. An empty
  # value is not sufficient because vLLM parses it with int(); remove it.
  unset VLLM_PREFIX_CACHE_RETENTION_INTERVAL
  model_root="{model}"
  mkdir -p "$GLM53_DIAGNOSTICS_DIR"
  test -w "$GLM53_DIAGNOSTICS_DIR"
  # The model root is identity-mounted from every Spark. Keeping online-K6
  # artifacts here makes the expensive first conversion persistent even though
  # the short-lived SparkRun executor container is removed after each run.
  mkdir -p "$model_root/.exl3-online-k6"
  test -w "$model_root/.exl3-online-k6"
  revision="$(cat "$model_root/refs/main")"
  model_path="$model_root/snapshots/$revision"
  test -r "$model_path/config.json"
  exec vllm serve "$model_path" \
    --served-model-name {served_model_name} \
    --host {host} --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend mp \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size 64 \
    --quantization exl3 \
    --quantization-config '{"linear":{"weight":"mxfp8"},"shared_experts":{"weight":"mxfp8"},"ignore":["re:.*\\.fused_qkv_a_proj$","re:.*\\.q_a_proj$","re:.*kv_a_proj_with_mqa","re:.*\\.mlp\\.gate$","model.layers.78.eh_proj","lm_head"]}' \
    --load-format instanttensor \
    --attention-backend B12X_MLA_SPARSE \
    --moe-backend b12x \
    --kv-cache-dtype fp8 \
    --decode-context-parallel-size 4 \
    --dcp-comm-backend ag_rs \
    --dcp-kv-cache-interleave-size 1 \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --generation-config vllm \
    --hf-overrides '{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}' \
    --speculative-config "{\"model\":\"$model_path\",\"method\":\"mtp\",\"num_speculative_tokens\":3,\"draft_tensor_parallel_size\":4,\"quantization\":\"exl3\",\"moe_backend\":\"b12x\",\"attention_backend\":\"B12X_MLA_SPARSE\",\"use_local_argmax_reduction\":false,\"draft_sample_method\":\"greedy\"}" \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32],"custom_ops":["all"],"pass_config":{"fuse_allreduce_rms":false}}'
