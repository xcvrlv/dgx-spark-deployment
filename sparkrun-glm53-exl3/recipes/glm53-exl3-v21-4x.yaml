# R22 comparison recipe for davidsyoung GLM-5.3 EXL3 using the checkpoint's
# native MTP heads on exactly four DGX Sparks. The R22 image retains DFlash2
# support, but this recipe deliberately does not load the external draft.
recipe_version: "2"
name: glm53-exl3-r22-v21-4x
description: v20 MTP3 with archived R7 paired FC2 M8 weight reuse as a prefill option.
model: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw
runtime: vllm-distributed
runtime_config:
  dashboard: false
container: spark-vllm-glm53-exl3:r22-dflash2-sm121-v21
min_nodes: 4
max_nodes: 4

metadata:
  model_dtype: exl3-mixed-3.42bpw
  speculative_method: model-native-mtp3
  runtime_release: local-inference-lab-r22-jovian-judgement
  runtime_commit: 70b3c1c7f1c76fcf0847fcbb4a0b8b5583b78d19
  b12x_commit: 1e59a1fd09f782d302b1068b15c8a0bd66103894
  b12x_rocenante_commit: 1a7e3ec286b0ff0b7c2aabee22dce08daab7e011
  performance_overlay: glm53-r22-performance-v1
  v11_overlay: glm53-r22-v11-1
  v12_overlay: glm53-r22-v12-1
  v13_overlay: glm53-r22-v13-1
  v14_overlay: glm53-r22-v14-1
  v15_overlay: glm53-r22-v15-1
  v16_overlay: glm53-r22-v16-3
  v17_overlay: glm53-r22-v17-1
  v18_overlay: glm53-r22-v18-1
  v19_overlay: glm53-r22-v19-1
  v20_overlay: glm53-r22-v20-1
  instanttensor_overlay: glm53-r22-v20-instanttensor-r1
  v21_overlay: glm53-r22-v21-1
  b12x_rocenante_backport: b58f34eaf978277621efced6678e6713fd7122e4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  decode_context_parallel: 4
  gpu_memory_utilization: 0.87
  max_model_len: 1048576
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  served_model_name: glm-5.3-exl3-r22-mtp3

env:
  # Local buffered streaming; extra-config below controls ownership and NCCL.
  INSTANTTENSOR_BACKEND: BUFFERED
  INSTANTTENSOR_BUFFER_SIZE: "536870912"
  INSTANTTENSOR_MAX_FREE_MEM_USAGE: "0.05"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "8"
  PYTHONFAULTHANDLER: "1"
  # v20: stripe only the ragged final FC1 wave of M8 decode/MTP plans along K
  # v20: across every CTA. Compile-time switch; restart all workers to A/B.
  # v20: Set to 0 to recover the v19 schedule; prefill and FC2 stay unchanged.
  VLLM_GB10_EXL3_FC1_TAILSPLIT: "1"
  # v21: archived R7 paired FC2. One pair call decodes one weight
  # fragment per two adjacent M8 subtiles with a single B stream;
  # production group4 becomes two pair calls. Compile-time switch;
  # restart all workers to A/B. Set to 0 to recover the stock
  # subtile loop; M8 decode never reaches the pair path.
  VLLM_GB10_EXL3_FC2_M8_PAIR: "1"
  VLLM_GB10_EXL3_FC2_GROUP: "4"
  VLLM_GB10_INDEXER_COALESCE: "1"
  VLLM_GB10_INDEXER_METADATA: "1"
  VLLM_GB10_STARTUP_RECLAIM: "1"
  # v16: DCP workspace, CKV and proxy overhead. Restart every worker to A/B.
  VLLM_GB10_DCP_GATHER_INTO: "1"
  VLLM_GB10_CKV_INPLACE: "1"
  VLLM_GB10_DCP_MERGE_ROWS: "256"
  B12X_ROCE_LAZY_PAYLOAD_INIT: "1"
  B12X_ROCE_SKIP_EMPTY_CQ: "1"
  # v15: inherited compute and switched-RoCE candidates.
  VLLM_GB10_COMPACT_INPUT: "1"
  VLLM_GB10_SIGMOID: "1"
  VLLM_GB10_SKINNY_GEMM: "1"
  B12X_ROCE_INLINE_PAYLOAD: "1"
  B12X_ROCE_BALANCED_FANOUT: "1"
  # v14: restart all workers after changing either kernel switch.
  VLLM_GB10_SHARED_INPUT_ROTATION: "1"
  VLLM_GB10_DRAFT_ARGMAX: "1"
  # v13: retain FP16 MMA and fuse the surrounding dense K6 rotations.
  VLLM_GB10_DENSE_ROTATIONS: "1"
  # v12: independent switches; restart every worker after changing.
  VLLM_GLM53_FUSED_CKV_METADATA: "1"
  VLLM_GLM53_BORROW_MLA_QUERY: "1"
  # v11: final mixed-K store narrows after FP32 router accumulation.
  # Set to 0 and restart all workers for an output-fusion A/B test.
  VLLM_EXL3_MIXED_FUSED_OUTPUT: "1"
  # Let NVIDIA Container Toolkit mount the Spark host's matching libcuda.
  # Preloading the image's forward-compat driver causes CUDA error 803.
  LD_PRELOAD: /opt/sparkring/nccl/libnccl.so.2
  VLLM_NCCL_SO_PATH: /opt/sparkring/nccl/libnccl.so.2
  CUDA_HOME: /usr/local/cuda
  TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: 12.1a
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  NCCL_NET: IB
  NCCL_NVLS_ENABLE: "0"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_CROSS_NIC: "1"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_HCA: rocep1s0f0,roceP2p1s0f0
  NCCL_IB_GID_INDEX: "3"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  # Route eligible small TP collectives through dual-rail RoCEnante. The
  # SparkRing NCCL transport remains the fallback above these bounds.
  B12X_ROCE_HCA: rocep1s0f0,roceP2p1s0f0
  B12X_ROCE_GID_INDEX: "3"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: 2MB
  VLLM_ROCE_ALLGATHER_MAX_SIZE: 16MB
  # v10 extends RoCEnante to attention's separate DCP communicator and
  # flattened query-head gathers. Keep the all-reduce + slice substitution
  # bounded to 256 KiB (four BF16 64-head x 512-value MTP verification rows).
  # Set RS_MAX_BYTES=0 to retain NCCL reduce-scatter while testing DCP gathers.
  VLLM_ROCE_DCP_ENABLE: "1"
  VLLM_ROCE_DCP_RS_MAX_BYTES: "262144"
  B12X_ROCE_CACHE_DIR: /opt/b12x-roce-cache
  OMP_NUM_THREADS: "8"
  TOKENIZERS_PARALLELISM: "false"
  MALLOC_ARENA_MAX: "2"

  # The checkpoint's routed experts are mixed K3/K4. Its BF16 dense/shared
  # expert projections are converted once to K6 and cached beside the model.
  VLLM_EXL3_EXT_PATH: /opt/exllamav3
  # B12X imports exllamav3_ext directly for had_r_128 instead of resolving it
  # through VLLM_EXL3_EXT_PATH.
  PYTHONPATH: /opt/exllamav3
  VLLM_EXL3_ENCODER_SOURCE: /opt/exllamav3-python/exllamav3
  VLLM_EXL3_ENCODER_REVISION: 704aefd743b390af4bd0fb429d1906f9b964c7d8
  VLLM_EXL3_ONLINE_TRELLIS_BITS: "6"
  VLLM_EXL3_ONLINE_CACHE_MODE: readwrite
  VLLM_EXL3_ONLINE_CACHE_DIR: /home/juho/.cache/huggingface/hub/models--davidsyoung--GLM-5.3-EXL3-TR3-3.42bpw/.exl3-online-k6-r22
  VLLM_EXL3_PREFILL_CAPACITY: "4096"
  VLLM_EXL3_TRELLIS_MIN_M: "1"
  VLLM_EXL3_TRELLIS_MAX_M: "64"
  VLLM_EXL3_TRELLIS_BLOCK_M: "8"
  VLLM_EXL3_PREFILL_TRELLIS: "1"
  VLLM_EXL3_PREFILL_BLOCK_M: "32"
  VLLM_EXL3_PREFILL_CHUNK: "128"

  # v10 adds GLM-DSA support: stock R22 only enabled full-CKV for GLM5Next.
  # Eligible pure-prefill batches gather the packed cache and keep local
  # query heads; decode and mixed batches retain ordinary DCP. Match safe's
  # 128K gather envelope to bound transient memory and fabric traffic.
  VLLM_B12X_MLA_CKV_GATHER: "1"
  VLLM_B12X_MLA_CKV_GATHER_MIN_TOKENS: "16"
  VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "131072"
  VLLM_USE_DIRECT_DCP_A2A: "0"
  VLLM_USE_DIRECT_DCP_Q_GATHER: "0"
  VLLM_USE_DIRECT_DCP_KV_GATHER: "0"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"
  VLLM_DCP_GLOBAL_TOPK: "1"
  VLLM_DCP_SHARD_DRAFT: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_MTP_INSTRUMENT: "1"
  VLLM_MTP_INSTRUMENT_WINDOW: "32"

  # Keep the first SM121 qualification on the known W4A16 activation path.
  B12X_W4A16_TC_DECODE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  # B12X PCIe all-reduce is a separate single-host path and must not be
  # selected for this one-GPU-per-node TP4 deployment.
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"

executor: docker
executor_config:
  auto_remove: true
  entrypoint: ""
  gpu_access_mode: gpus
  ipc: host
  network: host
  shm_size: 32gb
  ulimit:
    - memlock=-1:-1
    - nofile=1048576:1048576
  devices:
    - /dev/infiniband:/dev/infiniband

command: |
  set -euo pipefail
  unset NCCL_GRAPH_FILE VLLM_PREFIX_CACHE_RETENTION_INTERVAL
  model_root="{model}"
  resolve_snapshot() {
    root="$1"
    revision="$(cat "$root/refs/main")"
    path="$root/snapshots/$revision"
    test -r "$path/config.json"
    printf '%s' "$path"
  }
  model_path="$(resolve_snapshot "$model_root")"
  mkdir -p "$model_root/.exl3-online-k6-r22"
  test -w "$model_root/.exl3-online-k6-r22"
  python3 -c 'import torch, exllamav3_ext; assert hasattr(exllamav3_ext, "had_r_128")'
  exec vllm serve "$model_path" \
    --served-model-name {served_model_name} \
    --host {host} --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend mp \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --block-size 64 \
    --quantization exl3 \
    --quantization-config '{"linear":{"weight":"mxfp8"},"shared_experts":{"weight":"mxfp8"},"ignore":["re:.*\\.fused_qkv_a_proj$","re:.*\\.q_a_proj$","re:.*kv_a_proj_with_mqa","re:.*\\.mlp\\.gate$","model.layers.78.eh_proj","lm_head"]}' \
    --load-format instanttensor \
    --model-loader-extra-config '{"instanttensor_copy":true,"instanttensor_distributed":false}' \
    --attention-backend B12X \
    --moe-backend b12x \
    --kv-cache-dtype fp8 \
    --decode-context-parallel-size {decode_context_parallel} \
    --dcp-comm-backend ag_rs \
    --dcp-kv-cache-interleave-size 1 \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --generation-config vllm \
    --hf-overrides '{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}' \
    --speculative-config "{\"model\":\"$model_path\",\"method\":\"mtp\",\"num_speculative_tokens\":3,\"draft_tensor_parallel_size\":4,\"quantization\":\"exl3\",\"moe_backend\":\"b12x\",\"attention_backend\":\"B12X\",\"use_local_argmax_reduction\":true,\"draft_sample_method\":\"greedy\"}" \
    --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32],"custom_ops":["all"],"pass_config":{"fuse_allreduce_rms":false}}'
